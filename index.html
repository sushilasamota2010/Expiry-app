<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock & Expiry Tracker</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FullCalendar CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">

    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --font: #2d3436;
            --warning: #fdcb6e;
            --danger: #ff7675;
            --success: #00b894;
            --bg-card: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            min-height: 100vh;
            padding: 15px;
            color: var(--font);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Auth Container */
        .auth-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 400px;
            margin: 40px auto;
        }

        .auth-card h2 {
            margin-bottom: 15px;
            color: var(--primary);
            text-align: center;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .auth-toggle span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .nav-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.15);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        .logout-btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        .card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-left: 5px solid var(--primary);
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .status-expired { border-color: var(--danger); }
        .status-warning { border-color: var(--warning); }
        .status-good { border-color: var(--success); }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: white;
            font-weight: 600;
        }
        .badge-expired { background: var(--danger); }
        .badge-warning { background: var(--warning); color: #2d3436; }
        .badge-good { background: var(--success); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            margin-left: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-boxes-packing"></i> Stock & Expiry Tracker</h1>
    </header>

    <!-- AUTH SECTION -->
    <div id="authSection" class="auth-card">
        <h2 id="authTitle">Shopkeeper Login</h2>
        <form id="authForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="authEmail" placeholder="shop@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" id="authSubmitBtn" class="btn">Login</button>
        </form>
        <div class="auth-toggle">
            <span id="toggleAuthText">Don't have an account? Sign Up</span>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="appSection" style="display: none;">
        <div class="user-bar">
            <span><i class="fa-solid fa-store"></i> <span id="userEmailDisplay"></span></span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('add')"><i class="fa-solid fa-plus"></i> Add Item</button>
            <button class="nav-btn" onclick="switchTab('items')"><i class="fa-solid fa-list"></i> Stock List</button>
            <button class="nav-btn" onclick="switchTab('calendar')"><i class="fa-solid fa-calendar-days"></i> Calendar</button>
        </div>

        <!-- Tab 1: Add Item -->
        <div id="add" class="tab-section active card">
            <h2>Add New Stock Item</h2>
            <form id="itemForm">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g., Fresh Milk" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="itemCategory" placeholder="e.g., Dairy, Medicine, Snacks" required>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="itemQuantity" placeholder="e.g., 10" required>
                </div>
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="date" id="itemExpiry" required>
                </div>
                <button type="submit" class="btn">Save to Cloud</button>
            </form>
        </div>

        <!-- Tab 2: Stock List -->
        <div id="items" class="tab-section card">
            <h2>Current Inventory</h2>
            <div id="itemsList">
                <p style="text-align:center; color:#888;">Loading items...</p>
            </div>
        </div>

        <!-- Tab 3: Calendar View -->
        <div id="calendar" class="tab-section card">
            <div id="calendarView"></div>
        </div>
    </div>
</div>

<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSy...", // Your Firebase credentials remain configured
        authDomain: "item-expiry-app.firebaseapp.com",
        projectId: "item-expiry-app",
        storageBucket: "item-expiry-app.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let calendar = null;
    let isSignUp = false;

    // Authentication UI Toggle
    const authTitle = document.getElementById('authTitle');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const toggleAuthText = document.getElementById('toggleAuthText');

    toggleAuthText.addEventListener('click', () => {
        isSignUp = !isSignUp;
        if(isSignUp) {
            authTitle.innerText = "Create Shopkeeper Account";
            authSubmitBtn.innerText = "Sign Up";
            toggleAuthText.innerText = "Already have an account? Login";
        } else {
            authTitle.innerText = "Shopkeeper Login";
            authSubmitBtn.innerText = "Login";
            toggleAuthText.innerText = "Don't have an account? Sign Up";
        }
    });

    // Handle Login / Sign Up
    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;

        try {
            if(isSignUp) {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Account created successfully!");
            } else {
                await signInWithEmailAndPassword(auth, email, password);
            }
        } catch(err) {
            alert("Error: " + err.message);
        }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
        if(user) {
            currentUser = user;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('userEmailDisplay').innerText = user.email;
            loadItems();
        } else {
            currentUser = null;
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
        }
    });

    // Add Item
    document.getElementById('itemForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if(!currentUser) return;

        try {
            await addDoc(collection(db, "stock_items"), {
                userId: currentUser.uid,
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                quantity: document.getElementById('itemQuantity').value,
                expiry: document.getElementById('itemExpiry').value
            });
            document.getElementById('itemForm').reset();
            alert("Item added successfully!");
            switchTab('items');
        } catch(err) {
            alert("Error adding item: " + err.message);
        }
    });

    // Load User's Private Items Realtime
    function loadItems() {
        if(!currentUser) return;

        const q = query(collection(db, "stock_items"), where("userId", "==", currentUser.uid));
        
        onSnapshot(q, (snapshot) => {
            const listEl = document.getElementById('itemsList');
            listEl.innerHTML = '';
            const calendarEvents = [];

            if(snapshot.empty) {
                listEl.innerHTML = '<p style="text-align:center; color:#888;">No stock items added yet.</p>';
                initCalendar([]);
                return;
            }

            snapshot.forEach(docSnap => {
                const item = docSnap.data();
                const id = docSnap.id;
                
                // Expiry Math
                const today = new Date();
                today.setHours(0,0,0,0);
                const expDate = new Date(item.expiry);
                const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));

                let statusClass = 'status-good';
                let badgeClass = 'badge-good';
                let badgeText = `${diffDays} days left`;

                if(diffDays < 0) {
                    statusClass = 'status-expired';
                    badgeClass = 'badge-expired';
                    badgeText = 'Expired';
                } else if(diffDays <= 7) {
                    statusClass = 'status-warning';
                    badgeClass = 'badge-warning';
                    badgeText = `Expires in ${diffDays} days`;
                }

                // Render Item
                const itemEl = document.createElement('div');
                itemEl.className = `item-card ${statusClass}`;
                itemEl.innerHTML = `
                    <div>
                        <strong>${item.name}</strong> (${item.category})<br>
                        <small>Qty: ${item.quantity} | Expiry: ${item.expiry}</small>
                    </div>
                    <div>
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <button class="delete-btn" onclick="deleteItem('${id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listEl.appendChild(itemEl);

                // Add to Calendar Array
                calendarEvents.push({
                    title: `${item.name} (${item.quantity})`,
                    start: item.expiry,
                    color: diffDays < 0 ? '#ff7675' : (diffDays <= 7 ? '#fdcb6e' : '#00b894')
                });
            });

            initCalendar(calendarEvents);
        });
    }

    // Delete Item
    window.deleteItem = async (id) => {
        if(confirm("Delete this item?")) {
            await deleteDoc(doc(db, "stock_items", id));
        }
    };

    // Calendar
    function initCalendar(events) {
        const calEl = document.getElementById('calendarView');
        if(calendar) calendar.destroy();
        calendar = new FullCalendar.Calendar(calEl, {
            initialView: 'dayGridMonth',
            events: events
        });
        calendar.render();
    }

    // Tab Switcher
    window.switchTab = (tabId) => {
        document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        
        event.currentTarget.classList.add('active');
        if(tabId === 'calendar' && calendar) {
            setTimeout(() => calendar.updateSize(), 100);
        }
    };
</script>
</body>
</html>
